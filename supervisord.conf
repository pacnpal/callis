[supervisord]
nodaemon=true
logfile=/var/log/callis/supervisord.log
logfile_maxbytes=10MB
pidfile=/var/run/supervisord.pid
loglevel=info

[program:api]
command=/app/.venv/bin/python main.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=APP_VERSION="%(ENV_APP_VERSION)s"

[program:web]
command=/usr/local/bin/node /app/web
directory=/app/web
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOST="0.0.0.0",PORT="8080",CALLIS_API_ORIGIN="http://127.0.0.1:8000",NODE_ENV="production"

[program:sshd]
command=/entrypoint-sshd.sh
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
